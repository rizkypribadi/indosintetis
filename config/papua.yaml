# Nama distrik lama di skenario → nama distrik resmi (dipakai bila data/kampung.csv berisi geografi nyata).
# Nama sintetis "<Kabupaten> NN" otomatis dipetakan ke distrik ke-NN menurut penduduk.
alias_distrik:
  kep_yapen: {Serui: Yapen Selatan}
  biak_numfor: {Biak: Biak Kota}

# Ikatan antarwilayah (mobilitas kampung-kota & antarpulau) untuk tatap muka dan grup WA keluarga.
# Nilai = bobot relatif tujuan perantau/kerabat dari kabupaten asal.
ikatan:
  kota_jayapura: {kab_jayapura: 3, keerom: 1, kep_yapen: 1, biak_numfor: 1, sarmi: 0.5}
  kab_jayapura:  {kota_jayapura: 4, keerom: 1, sarmi: 0.5}
  keerom:        {kota_jayapura: 3, kab_jayapura: 2}
  sarmi:         {kota_jayapura: 2, kab_jayapura: 2, mamberamo_raya: 1}
  mamberamo_raya: {sarmi: 2, kota_jayapura: 1, waropen: 1}
  waropen:       {kep_yapen: 3, kota_jayapura: 1, biak_numfor: 1}
  kep_yapen:     {waropen: 2, biak_numfor: 2, kota_jayapura: 2}
  biak_numfor:   {supiori: 2, kep_yapen: 2, kota_jayapura: 2}
  supiori:       {biak_numfor: 4, kota_jayapura: 0.5}

# Stasiun radio (RRI & radio komunitas). Jangkauan = kabupaten yang dicakup.
radio:
  - {id: rri_jayapura, nama: RRI Jayapura, jangkauan: [kota_jayapura, kab_jayapura, keerom, sarmi], kepercayaan: 0.75}
  - {id: rri_biak, nama: RRI Biak, jangkauan: [biak_numfor, supiori, kep_yapen], kepercayaan: 0.75}
  - {id: rri_serui, nama: RRI Serui, jangkauan: [kep_yapen, waropen], kepercayaan: 0.75}
  - {id: komunitas_mamberamo, nama: Radio komunitas Mamberamo, jangkauan: [mamberamo_raya, sarmi], kepercayaan: 0.8}
