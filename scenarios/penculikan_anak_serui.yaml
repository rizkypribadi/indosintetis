komentar_contoh:
- Aduh, sa takut sekali. Anak sa juga pulang sekolah lewat situ. Semoga cepat tertangkap!
- Mama-mama di pasar su cerita, katanya anak itu hampir dibawa. Kita harus jaga anak-anak
  kita!
- Bapa-bapa, ayo kita jaga di sekolah dan pelabuhan. Jangan biarkan orang tak dikenal
  masuk kampung!
- Foto di Facebook itu benar? Kasihan anaknya. Semoga tidak terjadi lagi.
catatan: 'Skenario fiktif untuk simulasi. Isu penculikan oleh ''orang pendatang''
  tidak merujuk pada kelompok tertentu; pelaku digambarkan sebagai ''orang tak dikenal''
  untuk menghindari stereotip. Lokasi Serui di Kabupaten Kepulauan Yapen sesuai daftar
  wilayah. Asumsi: pesan pertama muncul Senin jam 12 siang di grup WhatsApp orang
  tua murid (3 grup), sore hari menyebar di pasar Serui (20 orang), jam 18 dua akun
  Facebook lokal mengunggah foto lama, dan Minggu pagi setelah ibadah dibicarakan
  lagi (30 orang). Intensitas emosi tinggi karena melibatkan keselamatan anak. Faktor
  identitas: orang tua anak sekolah (2.5), perempuan (2.0), pemuda (1.8). Ajakan tindakan
  fisik (berjaga, memeriksa orang baru) sehingga ajakan_tindakan true.'
deskripsi: 'Skenario hipotetis di Serui, Kabupaten Kepulauan Yapen. Senin pagi beredar

  kabar bahwa ada orang pendatang yang mencoba menculik anak SD pulang sekolah

  di Serui. Katanya pelaku naik motor tanpa plat, menawari anak permen dan uang,

  dan satu anak hampir dibawa ke pelabuhan sebelum ditolong mama-mama di pasar.

  Pesan menyebut "dong su incar anak-anak di kampung lain juga" dan mengajak

  bapa-bapa dan pemuda berjaga di sekolah, pelabuhan, dan jalan masuk kampung,

  serta memeriksa orang baru yang tidak dikenal.


  Pesan pertama muncul Senin jam 12 siang di grup WhatsApp orang tua murid di

  Serui. Sore harinya kabar menyebar dari mulut ke mulut di pasar Serui. Jam 18

  ada 2 akun Facebook lokal mengunggah foto lama anak menangis dengan keterangan

  "korban percobaan culik tadi siang". Minggu pagi kabar dibicarakan lagi

  sesudah ibadah. Yang paling cemas adalah orang tua anak sekolah, perempuan

  (mama-mama pasar), dan pemuda. Intensitas emosi tinggi (takut dan marah).

  Simulasikan 3 hari.


  isu penculik nya merupakan pendatang bukan orang papua.'
