komentar_contoh:
- Sa su dengar VN pu cerita, bapa. Jang sampe ada korban lai, kitorang minta aparat
  jelaskan e.
- Dong bilang pelaku naik mobil baru lepas, ini tra masuk akal. Kitorang jaga kampung
  tapi jang main hakim sendiri.
- Sesudah ibadah kitorang kumpul depan kantor distrik, bawa suara bukan bawa emosi.
  Ana-ana jangan dibawa.
catatan: Waktu T+0 diasumsikan Sabtu 19:00; simulasi 72 jam dengan langkah 30 menit.
  Sentani dipetakan ke Kab. Jayapura distrik Sentani; lokasi Kota Jayapura tanpa distrik
  spesifik dipetakan ke Kota Jayapura 01; Keerom dipetakan ke Keerom 01. Grup info
  satu jam kemudian, unggahan FB sekitar 21-22, dan pertemuan tatap muka mengikuti
  deskripsi. Frasa identitas 'pendatang/bukan orang timur' tidak dimasukkan ke pesan;
  pelaku tetap 'orang tak dikenal' agar tidak menargetkan kelompok. Voice note dan
  foto lama diasumsikan konten yang diteruskan tanpa verifikasi. Tidak ada provokator
  karena tidak disebut eksplisit; akun FB dianggap penyebar biasa. 'Orang tua' dipetakan
  ke lansia dan orang tua anak sekolah.
deskripsi: 'Skenario hipotetis di Kota Jayapura dan Kabupaten Jayapura. Sabtu malam

  beredar kabar bahwa seorang pemuda kampung dikejar orang tak dikenal di jalan

  Sentani–Abepura, lalu ditemukan meninggal di pinggir kali dengan badan penuh

  luka. Katanya ada saksi yang melihat pelaku naik mobil, tetapi pelaku sudah

  dilepas dan tidak ada yang ditangkap, dan masih ada orang lain yang akan

  diincar. Pesan disertai "voice note dari keluarga korban" dan mengajak semua

  warga berkumpul di depan kantor distrik sesudah ibadah Minggu, serta meminta

  pemuda berjaga di jalan masuk kampung malam itu.


  Pesan pertama muncul Sabtu jam 19 di grup WhatsApp marga di Sentani dan grup

  WhatsApp keluarga di Kota Jayapura, lalu satu jam kemudian di grup info.

  Sekitar jam 21–22, 4 akun Facebook lokal di Kota Jayapura dan 2 di Kabupaten

  Jayapura mengunggah ulang foto lama dengan keterangan "korban tadi sore".

  Malam itu sekitar 30 pemuda membicarakannya di pangkalan ojek dan kios di

  Sentani. Minggu pagi kabar sampai ke Keerom lewat grup WhatsApp jemaat, dan

  sesudah ibadah Minggu dibicarakan langsung oleh sekitar 30 orang di Kota

  Jayapura. Yang paling terpancing adalah pemuda dan laki-laki, juga orang tua

  dan pengguna HP. Emosi sangat tinggi (marah dan duka). Simulasikan 3 hari

  dengan langkah 30 menit.


  Isunya pelaku bukan merupakan warga pendatang yang bukan orang timur'
